<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SideKick settings</title>
    <style>
      :root { color-scheme: light dark; font: 14px/1.4 system-ui, sans-serif; }
      body { max-width: 560px; margin: 24px; }
      input { width: 100%; font: inherit; padding: 6px; margin: 4px 0 8px; }
      .hint { color: GrayText; font-size: 13px; }
      #result { margin-left: 8px; }
    </style>
  </head>
  <body>
    <h1>SideKick settings</h1>
    <label for="url">Backend URL</label>
    <input id="url" type="url" placeholder="http://localhost:8000" />
    <p class="hint">
      Windows 11 + WSL2: <code>http://localhost:8000</code>. ChromeOS + Crostini:
      <code>http://localhost:8000</code> or <code>http://penguin.linux.test:8000</code>.
      Start the backend with <code>just dev</code>.
    </p>
    <button id="save" type="button">Save</button>
    <button id="test" type="button">Test connection</button>
    <span id="result"></span>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
