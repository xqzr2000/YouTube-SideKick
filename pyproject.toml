[project]
name = "sidekick"
version = "0.0.1"
description = "YouTube-SideKick: a data-science-first recommendation cleaner for YouTube's up-next list"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "fastembed>=0.9.1",
    "fasttext-predict>=0.9.2.4",
    "httpx>=0.27",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "spacy>=3.8,<3.9",  # en_core_web_sm 3.8.0 needs spaCy 3.8.x
    "uvicorn>=0.30",
]

[dependency-groups]
nb = [
    "marimo>=0.9",
    "pandas>=2.2",
    "matplotlib>=3.9",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sidekick"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# marimo cells return tuples and reuse names across cells by design
"notebooks/**/*.py" = ["B018", "F811"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
